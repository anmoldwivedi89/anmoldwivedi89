<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes appear { 0% { opacity: 0; } 100% { opacity: 1; } }
      @keyframes slideLeft { 0% { transform: translateX(-400px); opacity: 0; } 100% { transform: translateX(0); opacity: 1; } }
      @keyframes slideRight { 0% { transform: translateX(400px); opacity: 0; } 100% { transform: translateX(0); opacity: 1; } }
      @keyframes shake { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
      @keyframes pulse { 0%, 100% { filter: drop-shadow(0 0 10px #ff6600); } 50% { filter: drop-shadow(0 0 25px #ffaa00); } }
      @keyframes flameFlicker { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
      @keyframes slash { 0% { transform: translateX(-100px) rotateZ(-45deg); opacity: 0; } 50% { opacity: 1; } 100% { transform: translateX(200px) rotateZ(45deg); opacity: 0; } }
      @keyframes damageFloat { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-100px); opacity: 0; } }
      @keyframes victoryGlow { 0% { opacity: 0; } 100% { opacity: 1; } }

      .scene { animation: appear 1s ease-out; }
      .shrine { animation: pulse 2s infinite; }
      .flame { animation: flameFlicker 0.8s infinite; }
      .dino { animation: slideRight 2s ease-out 2s forwards; }
      .dinoShake { animation: shake 0.6s ease-out 4s forwards; }
      .fire { animation: slideLeft 1.5s ease-out 5.5s forwards; }
      .hero { animation: slideLeft 1.5s ease-out 7s forwards; }
      .slash1 { animation: slash 0.7s ease-out 9s forwards; }
      .slash2 { animation: slash 0.7s ease-out 10.5s forwards; }
      .slash3 { animation: slash 0.7s ease-out 12s forwards; }
      .damage { animation: damageFloat 1s ease-out 11s forwards; }
      .victory { animation: victoryGlow 1.5s ease-out 13s forwards; }

      text { font-family: Arial, sans-serif; font-weight: bold; }
      .title { font-size: 32px; fill: #ffaa00; text-anchor: middle; }
      .hud { font-size: 18px; fill: #00ff00; font-family: monospace; }
      .damage-text { font-size: 48px; fill: #ffff00; text-anchor: middle; stroke: #ff0000; stroke-width: 2; }
    </style>
  </defs>

  <!-- BACKGROUND -->
  <rect width="1200" height="800" fill="#0a0a2e"/>
  <rect width="1200" height="400" fill="#16213e" y="400"/>

  <!-- Mountains -->
  <polygon points="0,500 200,300 400,500" fill="#1a1a4d" opacity="0.9"/>
  <polygon points="350,500 650,250 950,500" fill="#0f0f3d" opacity="0.8"/>
  <polygon points="850,500 1050,350 1200,500" fill="#1a1a4d" opacity="0.9"/>

  <!-- Stars -->
  <circle cx="100" cy="80" r="2" fill="#fff" opacity="0.8"/>
  <circle cx="300" cy="120" r="1.5" fill="#fff" opacity="0.6"/>
  <circle cx="600" cy="60" r="2" fill="#fff" opacity="0.7"/>
  <circle cx="900" cy="100" r="1.5" fill="#fff" opacity="0.8"/>
  <circle cx="1100" cy="90" r="2" fill="#fff" opacity="0.6"/>

  <!-- GITHUB STREAK SHRINE - CENTER -->
  <g class="scene shrine">
    <rect x="480" y="300" width="240" height="220" fill="#2a1810" stroke="#ff9900" stroke-width="4" rx="8"/>
    <circle cx="600" cy="380" r="50" fill="none" stroke="#ff6600" stroke-width="2" opacity="0.7"/>

    <!-- Flames -->
    <g class="flame" style="animation-delay: 0s"><polygon points="560,480 568,440 576,480" fill="#ff6600"/></g>
    <g class="flame" style="animation-delay: 0.1s"><polygon points="580,480 588,440 596,480" fill="#ff7700"/></g>
    <g class="flame" style="animation-delay: 0.2s"><polygon points="600,480 608,440 616,480" fill="#ff8800"/></g>
    <g class="flame" style="animation-delay: 0.3s"><polygon points="620,480 628,440 636,480" fill="#ff7700"/></g>
    <g class="flame" style="animation-delay: 0.4s"><polygon points="640,480 648,440 656,480" fill="#ff6600"/></g>

    <text x="600" y="350" class="title" font-size="20">🔥 STREAK 🔥</text>
  </g>

  <!-- DINO BOSS -->
  <g class="dino dinoShake">
    <!-- Body -->
    <ellipse cx="950" cy="280" rx="90" ry="60" fill="#dd3333" stroke="#990000" stroke-width="3"/>
    <!-- Neck -->
    <rect x="1020" y="220" width="45" height="70" fill="#dd3333" stroke="#990000" stroke-width="2"/>
    <!-- Head -->
    <circle cx="1070" cy="190" r="50" fill="#ff4444" stroke="#990000" stroke-width="2"/>
    <!-- Jaw -->
    <ellipse cx="1080" cy="220" rx="40" ry="22" fill="#cc2222" stroke="#990000" stroke-width="1"/>
    <!-- Eye -->
    <circle cx="1090" cy="175" r="10" fill="#ffff00" stroke="#000" stroke-width="1"/>
    <circle cx="1092" cy="173" r="5" fill="#000"/>
    <!-- Teeth -->
    <rect x="1050" y="235" width="10" height="10" fill="#fff"/>
    <rect x="1068" y="240" width="10" height="10" fill="#fff"/>
    <rect x="1085" y="240" width="10" height="10" fill="#fff"/>
    <!-- Horn -->
    <polygon points="1060,135 1065,95 1055,140" fill="#666" stroke="#333" stroke-width="2"/>
    <!-- Legs -->
    <rect x="900" y="320" width="30" height="85" fill="#cc2222" stroke="#990000" stroke-width="2" rx="8"/>
    <rect x="1000" y="320" width="30" height="85" fill="#cc2222" stroke="#990000" stroke-width="2" rx="8"/>
    <rect x="880" y="310" width="28" height="100" fill="#bb1111" stroke="#990000" stroke-width="2" rx="8"/>
    <rect x="1050" y="310" width="28" height="100" fill="#bb1111" stroke="#990000" stroke-width="2" rx="8"/>
  </g>

  <!-- FIRE BREATH -->
  <g class="fire">
    <polygon points="1120,170 1250,140 1250,240 1120,210" fill="#ff5500" opacity="0.8"/>
    <polygon points="1140,190 1280,150 1280,270 1140,230" fill="#ff8800" opacity="0.6"/>
    <circle cx="1150" cy="210" r="30" fill="#ffaa00" opacity="0.4"/>
  </g>

  <!-- HERO (PIXEL ART WARRIOR) -->
  <g class="hero">
    <!-- Head -->
    <rect x="150" y="160" width="40" height="40" fill="#d4a574" stroke="#000" stroke-width="2"/>
    <!-- Hair -->
    <polygon points="150,160 190,160 180,140 160,140" fill="#8b4513" stroke="#000" stroke-width="1"/>
    <!-- Eyes -->
    <rect x="158" y="170" width="6" height="6" fill="#000"/>
    <rect x="176" y="170" width="6" height="6" fill="#000"/>
    <!-- Body (Blue Cape + Armor) -->
    <rect x="145" y="200" width="50" height="50" fill="#0066ff" stroke="#000" stroke-width="2"/>
    <!-- Armor chest -->
    <rect x="155" y="205" width="30" height="35" fill="#cccccc" stroke="#999" stroke-width="1"/>
    <!-- Arms -->
    <rect x="120" y="210" width="25" height="50" fill="#d4a574" stroke="#000" stroke-width="1"/>
    <rect x="200" y="210" width="25" height="50" fill="#d4a574" stroke="#000" stroke-width="1"/>
    <!-- Legs -->
    <rect x="155" y="250" width="15" height="40" fill="#333" stroke="#000" stroke-width="1"/>
    <rect x="175" y="250" width="15" height="40" fill="#333" stroke="#000" stroke-width="1"/>
    <!-- Shield -->
    <circle cx="220" cy="230" r="20" fill="#ff9900" stroke="#cc6600" stroke-width="2"/>
    <!-- Sword -->
    <g>
      <rect x="80" y="180" width="12" height="100" fill="#4488ff" stroke="#0044cc" stroke-width="2"/>
      <polygon points="86,175 80,185 92,185" fill="#ffff00"/>
      <circle cx="86" cy="290" r="8" fill="#ff8800"/>
    </g>
  </g>

  <!-- SWORD SLASHES -->
  <g class="slash1">
    <line x1="200" y1="200" x2="850" y2="320" stroke="#4488ff" stroke-width="18" stroke-linecap="round" opacity="0.9"/>
    <line x1="200" y1="230" x2="850" y2="350" stroke="#88ccff" stroke-width="10" stroke-linecap="round" opacity="0.6"/>
    <circle cx="850" cy="320" r="25" fill="#4488ff" opacity="0.5"/>
  </g>

  <g class="slash2">
    <line x1="200" y1="250" x2="900" y2="260" stroke="#4488ff" stroke-width="18" stroke-linecap="round" opacity="0.9"/>
    <line x1="200" y1="280" x2="900" y2="290" stroke="#88ccff" stroke-width="10" stroke-linecap="round" opacity="0.6"/>
    <circle cx="900" cy="260" r="25" fill="#4488ff" opacity="0.5"/>
  </g>

  <g class="slash3">
    <line x1="200" y1="200" x2="950" y2="350" stroke="#4488ff" stroke-width="18" stroke-linecap="round" opacity="0.9"/>
    <line x1="200" y1="240" x2="950" y2="390" stroke="#88ccff" stroke-width="10" stroke-linecap="round" opacity="0.6"/>
    <line x1="180" y1="200" x2="970" y2="350" stroke="#ffff00" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
    <circle cx="950" cy="350" r="35" fill="#ffff00" opacity="0.4"/>
  </g>

  <!-- DAMAGE NUMBER -->
  <text class="damage" x="950" y="220">999</text>

  <!-- HUD PANELS -->
  <!-- Player HUD -->
  <rect x="20" y="20" width="280" height="140" fill="#000" opacity="0.85" stroke="#00ff00" stroke-width="3" rx="8"/>
  <text x="40" y="50" class="hud" font-size="20">ANMOL</text>
  <text x="40" y="75" class="hud" font-size="16">LVL 22</text>
  <text x="40" y="105" class="hud" font-size="14">HP: 100/100</text>
  <rect x="40" y="115" width="240" height="20" fill="#003300" stroke="#00ff00" stroke-width="1"/>
  <rect x="40" y="115" width="240" height="20" fill="#00ff00" opacity="0.8"/>

  <!-- Boss HUD -->
  <rect x="900" y="20" width="280" height="120" fill="#000" opacity="0.85" stroke="#ff0000" stroke-width="3" rx="8"/>
  <text x="920" y="50" class="hud" font-size="20" fill="#ff0000">DINO BOSS</text>
  <text x="920" y="85" class="hud" font-size="14" fill="#ff0000">HP: 100/100</text>
  <rect x="920" y="95" width="240" height="20" fill="#330000" stroke="#ff0000" stroke-width="1"/>
  <rect x="920" y="95" width="240" height="20" fill="#00ff00" opacity="0.8"/>

  <!-- BATTLE TITLE -->
  <text x="600" y="60" class="title" font-size="36">⚔️ STREAK GUARDIAN QUEST ⚔️</text>

  <!-- VICTORY OVERLAY -->
  <g class="victory" opacity="0">
    <rect width="1200" height="800" fill="#000" opacity="0.7"/>
    <text x="600" y="200" text-anchor="middle" font-size="64" fill="#ffff00" font-weight="bold">🏆 VICTORY! 🏆</text>
    <text x="600" y="280" text-anchor="middle" font-size="48" fill="#ff6600" font-weight="bold">🔥 STREAK SAVED 🔥</text>
    <text x="600" y="360" text-anchor="middle" font-size="32" fill="#00ff00" font-weight="bold">+1000 XP</text>
    <text x="600" y="410" text-anchor="middle" font-size="32" fill="#00ff00" font-weight="bold">+50 COMMITS</text>
    <text x="600" y="460" text-anchor="middle" font-size="32" fill="#00ff00" font-weight="bold">+10 STARS</text>
    <text x="600" y="550" text-anchor="middle" font-size="40" fill="#0099ff" font-weight="bold">KEEP CODING</text>
    <text x="600" y="610" text-anchor="middle" font-size="40" fill="#0099ff" font-weight="bold">KEEP WINNING</text>
    <text x="600" y="700" text-anchor="middle" font-size="48" fill="#ff0000">❤️</text>
  </g>
</svg>