<svg viewBox="0 0 1024 1050" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes fadeOut {
        from { opacity: 1; }
        to { opacity: 0; }
      }
      @keyframes pulse {
        0%, 100% { filter: drop-shadow(0 0 10px rgba(255, 150, 0, 0.8)); }
        50% { filter: drop-shadow(0 0 20px rgba(255, 150, 0, 1)); }
      }
      @keyframes glow {
        0%, 100% { filter: brightness(1); }
        50% { filter: brightness(1.3); }
      }
      @keyframes shake {
        0%, 100% { transform: translateY(0); }
        10% { transform: translateY(-8px); }
        20% { transform: translateY(0); }
        30% { transform: translateY(-8px); }
        40% { transform: translateY(0); }
      }

      .battle-image { animation: fadeIn 0.5s ease-out; }
      .victory-overlay { animation: fadeIn 2s ease-out 20s forwards; }
      .pulse-effect { animation: pulse 2s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Main Battle Image -->
  <image class="battle-image" xlink:href="https://raw.githubusercontent.com/anmoldwivedi89/anmoldwivedi89/index.html/anmol.png" x="0" y="0" width="1024" height="1050" preserveAspectRatio="xMidYMid meet"/>

  <!-- Victory Glow Overlay - appears after victory -->
  <rect class="victory-overlay" width="1024" height="1050" fill="#00ff00" opacity="0.1" style="opacity: 0;"/>

  <!-- Animated Fire Effect - overlays on shrine area -->
  <g class="pulse-effect" style="opacity: 0;">
    <circle cx="512" cy="200" r="60" fill="#ff6600" opacity="0.3"/>
  </g>

  <!-- Victory Flash -->
  <rect class="victory-overlay" width="1024" height="1050" fill="#ffff00" opacity="0.05" style="opacity: 0;"/>
</svg>